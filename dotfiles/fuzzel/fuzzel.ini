# App launcher — slides up from bottom-center, like caelestia's launcher.
# Tokyo Night palette.
[main]
# fuzzel ignores SIGCHLD; Chromium/QtWebEngine apps (qutebrowser) inherit it and
# abort in their sandbox (waitpid -> ECHILD). launch.sh resets SIGCHLD then execs.
launch-prefix=/home/omare/.config/fuzzel/launch.sh
font=Noto Sans:size=13,Iosevka Nerd Font:size=13
terminal=ghostty -e
layer=overlay
anchor=bottom
y-margin=80
prompt="   "
icon-theme=Papirus-Dark
icons-enabled=yes
width=42
lines=10
horizontal-pad=24
vertical-pad=18
inner-pad=10

[border]
radius=18
width=2

[colors]
background=1a1b26f2
text=c0caf5ff
prompt=7aa2f7ff
input=c0caf5ff
match=9ece6aff
selection=283457ff
selection-text=c0caf5ff
selection-match=9ece6aff
border=7aa2f7ff
